<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>เปิดสิทธิ์ไมโครโฟน — ช่างถึก AI</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 48px);
    }
    .icon { font-size: 42px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px; font-size: 18px; color: #f97316; }
    p { margin: 0 0 16px; font-size: 14px; color: #cbd5e1; line-height: 1.5; }
    button {
      background: #f97316;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🎙️</div>
  <h2>อนุญาตไมโครโฟนสำหรับ ช่างถึก AI</h2>
  <p id="statusText">กรุณากดปุ่ม <b>"อนุญาต" (Allow)</b> ที่มุมซ้ายบนของหน้าต่างนี้ เพื่อเปิดใช้งานการสั่งงานด้วยเสียงภาษาไทยครับ</p>
  <button id="btnRetry">กดเพื่อขอสิทธิ์ไมโครโฟน</button>
  <script src="mic-permission.js"></script>
</body>
</html>
